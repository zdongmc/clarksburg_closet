<title>Request Queue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap">

<style>
  :root {
    --ground:      #F2F4F7;
    --panel:       #FFFFFF;
    --sunk:        #EDF0F4;
    --ink:         #141B24;
    --ink-soft:    #58636F;
    --rule:        #DCE2E9;
    --rule-strong: #B6C0CA;
    --accent:      #00467F;
    --accent-ink:  #FFFFFF;
    --accent-soft: #E4EDF5;
    --green:       #47701B;
    --green-soft:  #E9F1DD;
    --amber:       #8A5A10;
    --amber-soft:  #F8EFDD;
    --red:         #A33A2E;
    --red-soft:    #F8E7E4;
    color-scheme: light;

    --display: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
    --body:    'Source Sans 3', 'Segoe UI', system-ui, sans-serif;
    --mono:    'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:      #11161C;
      --panel:       #1A2027;
      --sunk:        #161B21;
      --ink:         #E8ECF1;
      --ink-soft:    #98A4B0;
      --rule:        #2A313A;
      --rule-strong: #454F59;
      --accent:      #94BBDE;
      --accent-ink:  #0E141A;
      --accent-soft: #212D39;
      --green:       #A6C97B;
      --green-soft:  #212B19;
      --amber:       #DBA95E;
      --amber-soft:  #2B2519;
      --red:         #E2857A;
      --red-soft:    #2E1D1A;
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --ground:      #11161C;
    --panel:       #1A2027;
    --sunk:        #161B21;
    --ink:         #E8ECF1;
    --ink-soft:    #98A4B0;
    --rule:        #2A313A;
    --rule-strong: #454F59;
    --accent:      #94BBDE;
    --accent-ink:  #0E141A;
    --accent-soft: #212D39;
    --green:       #A6C97B;
    --green-soft:  #212B19;
    --amber:       #DBA95E;
    --amber-soft:  #2B2519;
    --red:         #E2857A;
    --red-soft:    #2E1D1A;
    color-scheme: dark;
  }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 60rem;
    margin: 0 auto;
    padding-inline: 18px;
    padding-block: 26px 72px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .notice {
    background: var(--amber-soft);
    border-left: 3px solid var(--amber);
    padding: 11px 15px;
    font-size: 0.87rem;
  }

  .notice strong { font-family: var(--display); }

  /* ---------- masthead ---------- */

  .masthead {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .logo { width: 62px; height: 62px; flex: none; display: block; }

  .mast-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

  .eyebrow {
    font-family: var(--mono);
    font-size: 0.68rem;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }

  h1 {
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(1.6rem, 4.6vw, 2.1rem);
    letter-spacing: -0.025em;
    line-height: 1.05;
    margin: 0;
  }

  /* ---------- stat tiles ---------- */

  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
    gap: 1px;
    background: var(--rule);
    border: 1px solid var(--rule);
  }

  .stat {
    background: var(--panel);
    padding: 12px 15px;
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .stat .k {
    font-family: var(--display);
    font-size: 0.66rem;
    font-weight: 700;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .stat .v {
    font-family: var(--display);
    font-size: 1.9rem;
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
  }

  .stat.is-filled .v { color: var(--green); }
  .stat.is-crisis-stat .v { color: var(--red); }

  /* ---------- controls ---------- */

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
  }

  .filters { display: flex; flex-wrap: wrap; gap: 6px; }

  .filter {
    font-family: var(--display);
    font-size: 0.92rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    background: var(--panel);
    color: var(--ink-soft);
    border: 1px solid var(--rule-strong);
    padding: 10px 15px;
    min-height: 44px;
    cursor: pointer;
  }

  .filter:hover { border-color: var(--accent); color: var(--ink); }

  .filter[aria-pressed="true"] {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }

  .filter .n { font-family: var(--mono); opacity: 0.75; margin-left: 5px; }

  .search {
    flex: 1 1 15rem;
    max-width: 22rem;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .search input {
    font-family: var(--body);
    font-size: 1rem;
    min-height: 44px;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--rule-strong);
    padding: 8px 11px;
    width: 100%;
  }

  .search .hint { font-size: 0.75rem; color: var(--ink-soft); }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* ---------- queue ---------- */

  .queue { display: flex; flex-direction: column; gap: 10px; }

  .req {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-left: 4px solid var(--rule-strong);
  }

  .req.s-new { border-left-color: var(--accent); }
  .req.s-progress { border-left-color: var(--amber); }
  .req.s-filled { border-left-color: var(--green); }
  .req.s-declined { border-left-color: var(--red); }

  /* Crisis is a volunteer's own designation, so it outlines the whole card
     rather than taking the left edge, which already encodes status. */
  .req.is-crisis { box-shadow: inset 0 0 0 2px var(--red); }

  .req-main {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px 18px;
    padding: 14px 16px;
    align-items: start;
  }

  .req-who { display: flex; flex-direction: column; gap: 3px; min-width: 0; }

  .req-name {
    font-family: var(--display);
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: -0.015em;
    line-height: 1.2;
    margin: 0;
  }

  .req-org { font-size: 0.92rem; color: var(--ink-soft); }
  .req-org em { font-style: italic; }

  .req-contact {
    display: flex;
    flex-wrap: wrap;
    gap: 2px 16px;
    font-family: var(--mono);
    font-size: 0.92rem;
    font-variant-numeric: tabular-nums;
  }

  .req-contact a {
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--rule-strong);
    overflow-wrap: anywhere;
  }

  .req-contact a:hover { color: var(--accent); border-color: var(--accent); }

  .req-facts {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 14px;
    font-size: 0.85rem;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  .req-facts .id { font-family: var(--mono); color: var(--ink); }

  .req-side {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }

  .pill {
    font-family: var(--display);
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 10px;
    white-space: nowrap;
    border: 1px solid transparent;
  }

  .pill.new { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .pill.progress { background: var(--amber-soft); color: var(--amber); border-color: var(--amber); }
  .pill.filled { background: var(--green-soft); color: var(--green); border-color: var(--green); }
  .pill.declined { background: var(--red-soft); color: var(--red); border-color: var(--red); }
  .pill.crisis { background: var(--red); color: var(--panel); border-color: var(--red); }

  .pills { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

  .acts { display: flex; gap: 7px; flex-wrap: wrap; justify-content: flex-end; }

  .crisis-check {
    display: flex;
    align-items: center;
    gap: 7px;
    font-family: var(--display);
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
    cursor: pointer;
    white-space: nowrap;
  }

  .crisis-check { padding: 8px 0; min-height: 44px; }
  .crisis-check input { width: 1.5rem; height: 1.5rem; accent-color: var(--red); cursor: pointer; }
  .crisis-check:hover { color: var(--red); }
  .crisis-check.on { color: var(--red); }

  /* Touch sizing throughout: this runs on an iPad, so every control clears a
     44px target and no field is small enough to trigger iOS focus zoom. */
  .btn {
    font-family: var(--display);
    font-size: 0.95rem;
    font-weight: 600;
    background: var(--accent);
    color: var(--accent-ink);
    border: 1px solid var(--accent);
    padding: 11px 16px;
    min-height: 44px;
    cursor: pointer;
    white-space: nowrap;
  }

  .btn.ghost { background: none; color: var(--accent); }
  .btn.ghost:hover { background: var(--accent-soft); }

  .btn.done { background: var(--green); border-color: var(--green); color: var(--accent-ink); }
  .btn.done:hover { filter: brightness(1.08); }

  .btn.quiet {
    background: none;
    color: var(--ink-soft);
    border-color: var(--rule-strong);
  }

  .btn.quiet:hover { color: var(--ink); border-color: var(--ink-soft); }

  .btn.danger { background: none; color: var(--red); border-color: var(--red); }
  .btn.danger:hover { background: var(--red-soft); }

  /* Declining asks for a reason inline rather than in a modal -- it is a
     decision the requester will be told about, so it should not be one click. */
  .decline-panel {
    border-top: 1px solid var(--rule);
    background: var(--red-soft);
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .decline-panel .cap {
    font-family: var(--display);
    font-size: 0.66rem;
    font-weight: 700;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--red);
  }

  .decline-panel select,
  .decline-panel input {
    font-family: var(--body);
    font-size: 1rem;
    min-height: 44px;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--rule-strong);
    padding: 8px 10px;
    width: 100%;
  }

  .decline-fields {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr));
    gap: 10px;
  }

  .decline-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .reason-line { font-size: 0.85rem; color: var(--red); }

  /* ---------- expanded recipients ---------- */

  .req-detail {
    border-top: 1px solid var(--rule);
    padding: 12px 16px 15px;
    background: var(--sunk);
    display: flex;
    flex-direction: column;
    gap: 9px;
  }

  .detail-cap {
    font-family: var(--display);
    font-size: 0.66rem;
    font-weight: 700;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .rlist { display: flex; flex-direction: column; gap: 1px; background: var(--rule); border: 1px solid var(--rule); }

  .rrow {
    background: var(--panel);
    padding: 8px 12px;
    display: grid;
    grid-template-columns: minmax(8rem, 1.2fr) repeat(auto-fit, minmax(6rem, 1fr));
    gap: 4px 14px;
    align-items: baseline;
  }

  .rrow .who { display: flex; flex-direction: column; gap: 0; min-width: 0; }
  .rrow .rn { font-family: var(--display); font-weight: 700; font-size: 0.95rem; }
  .rrow .ra { font-size: 0.8rem; color: var(--ink-soft); }

  .sz { display: flex; flex-direction: column; gap: 0; min-width: 0; }
  .sz .k {
    font-family: var(--display);
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .sz .v { font-family: var(--mono); font-size: 0.95rem; font-weight: 500; overflow-wrap: anywhere; }
  .sz .v.none { font-family: var(--body); font-style: italic; color: var(--ink-soft); font-size: 0.85rem; }

  .rflag {
    grid-column: 1 / -1;
    font-size: 0.82rem;
    color: var(--amber);
    background: var(--amber-soft);
    border-left: 2px solid var(--amber);
    padding: 4px 9px;
  }

  .prayer-line {
    font-size: 0.9rem;
    font-style: italic;
    color: var(--ink-soft);
  }

  .empty {
    background: var(--panel);
    border: 1px dashed var(--rule-strong);
    padding: 28px 20px;
    text-align: center;
    color: var(--ink-soft);
  }

  /* ---------- toast ---------- */

  .toast {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--ground);
    padding: 11px 18px;
    font-size: 0.92rem;
    display: flex;
    align-items: center;
    gap: 14px;
    max-width: calc(100% - 32px);
    z-index: 20;
  }

  .toast button {
    font-family: var(--display);
    font-size: 0.9rem;
    padding: 6px 2px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    background: none;
    border: none;
    border-bottom: 1px solid currentColor;
    color: inherit;
    cursor: pointer;
    padding: 0 0 1px;
  }

  /* iPad portrait is 768px: give the actions their own full-width row well
     before that, so buttons never compress into a narrow right-hand column. */
  @media (max-width: 900px) {
    .req-main { grid-template-columns: 1fr; }
    .req-side { align-items: stretch; }
    .pills { justify-content: flex-start; }
    .acts { justify-content: flex-start; }
    .acts .btn { flex: 1 1 auto; }
    .crisis-check { justify-content: flex-start; }
  }

  @media (max-width: 620px) {
    .req-main { grid-template-columns: 1fr; }
    .req-side { align-items: flex-start; }
    .acts, .pills { justify-content: flex-start; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>

    var hay = [r.id, r.name, r.org || '', r.phone, r.email,
               r.people.map(function (p) { return p.n; }).join(' ')].join(' ').toLowerCase();
    return hay.indexOf(q.toLowerCase()) !== -1;
  }

  function inFilter(r, f) {
    if (f === 'all') return true;
    if (f === 'open') return isOpen(r);
    if (f === 'crisis') return !!r.crisis && isOpen(r);
    return r.status === f;
  }

  // ---------------------------------------------------------------------
  // Render
  // ---------------------------------------------------------------------

  var queueEl = document.getElementById('queue');
  var statsEl = document.getElementById('stats');
  var filtersEl = document.getElementById('filters');
  var qEl = document.getElementById('q');

  var STATUS_LABEL = {
    'new': 'Not started', 'progress': 'Printed', 'filled': 'Filled', 'declined': 'Declined'
  };

  var DECLINE_REASONS = [
    'Already received clothing this season',
    'Duplicate of another request',
    'Outside the area we serve',
    'Could not reach the requester',
    'We do not have these items',
    'Other'
  ];

  var FILTERS = [
    { key: 'open',     label: 'To do' },
    { key: 'crisis',   label: 'Crisis' },
    { key: 'new',      label: 'Not started' },
    { key: 'progress', label: 'Printed' },
    { key: 'filled',   label: 'Filled' },
    { key: 'declined', label: 'Declined' },
    { key: 'all',      label: 'All' }
  ];

  function counts() {
    var c = { all: REQUESTS.length, open: 0, new: 0, progress: 0, filled: 0, declined: 0, crisis: 0, people: 0 };
    REQUESTS.forEach(function (r) {
      c[r.status] += 1;
      if (isOpen(r)) { c.open += 1; c.people += r.people.length; }
      if (r.crisis && isOpen(r)) c.crisis += 1;
    });
    return c;
  }

  function renderStats() {
    var c = counts();
    statsEl.innerHTML = '';
    [
      { k: 'Waiting', v: c.open, cls: '' },
      { k: 'Crisis', v: c.crisis, cls: 'is-crisis-stat' },
      { k: 'People to clothe', v: c.people, cls: '' },
      { k: 'Filled', v: c.filled, cls: 'is-filled' }
    ].forEach(function (s) {
      var d = el('div', 'stat ' + s.cls);
      d.appendChild(el('span', 'k', s.k));
      d.appendChild(el('span', 'v', String(s.v)));
      statsEl.appendChild(d);
    });
  }

  function renderFilters() {
    var c = counts();
    filtersEl.innerHTML = '';
    FILTERS.forEach(function (f) {
      var b = el('button', 'filter');
      b.type = 'button';
      b.setAttribute('aria-pressed', state.filter === f.key);
      b.appendChild(document.createTextNode(f.label));
      var n = el('span', 'n', String(c[f.key]));
      b.appendChild(n);
      b.addEventListener('click', function () {
        state.filter = f.key;
        render();
      });
      filtersEl.appendChild(b);
    });
  }

  function sizeCell(k, v) {
    var d = el('div', 'sz');
    d.appendChild(el('span', 'k', k));
    if (v) d.appendChild(el('span', 'v', v));
    else d.appendChild(el('span', 'v none', 'Not needed'));
    return d;
  }

  function renderDetail(r) {
    var wrap = el('div', 'req-detail');
    wrap.appendChild(el('div', 'detail-cap', r.people.length + (r.people.length === 1 ? ' recipient' : ' recipients')));

    var list = el('div', 'rlist');
    r.people.forEach(function (p) {
      var row = el('div', 'rrow');
      var who = el('div', 'who');
      who.appendChild(el('span', 'rn', p.n));
      who.appendChild(el('span', 'ra', p.a));
      row.appendChild(who);
      row.appendChild(sizeCell('Shirt', p.shirt));
      row.appendChild(sizeCell('Pants', p.pant));
      row.appendChild(sizeCell('Shoes', p.shoe));
      row.appendChild(sizeCell('Diapers', p.dia));
      if (p.flag) row.appendChild(el('div', 'rflag', p.flag));
      list.appendChild(row);
    });
    wrap.appendChild(list);

    if (r.prayer) wrap.appendChild(el('div', 'prayer-line', '“' + r.prayer + '”'));
    return wrap;
  }

  function renderRequest(r) {
    var box = el('article', 'req s-' + r.status + (r.crisis ? ' is-crisis' : ''));

    var main = el('div', 'req-main');

    var who = el('div', 'req-who');
    who.appendChild(el('h2', 'req-name', r.name));
    var org = el('div', 'req-org');
    if (r.org) org.textContent = r.org;
    else org.innerHTML = '<em>Requesting for their own household</em>';
    who.appendChild(org);

    // Phone and email sit on the row itself: chasing a missing size or a
    // pickup time is the commonest reason a volunteer opens a request at all.
    var contact = el('div', 'req-contact');
    var tel = el('a', null, r.phone);
    tel.href = 'tel:' + r.phone.replace(/[^0-9+]/g, '');
    contact.appendChild(tel);
    var mail = el('a', null, r.email);
    mail.href = 'mailto:' + r.email;
    contact.appendChild(mail);
    who.appendChild(contact);

    var facts = el('div', 'req-facts');
    facts.appendChild(el('span', 'id', '#' + r.id));
    facts.appendChild(el('span', null, r.people.length + (r.people.length === 1 ? ' recipient' : ' recipients')));
    facts.appendChild(el('span', null, 'Received ' + fmt(r.received) + ' · ' + waitText(r)));
    if (r.status === 'filled' && r.filledOn) facts.appendChild(el('span', null, 'Filled ' + fmt(r.filledOn)));
    if (r.status === 'declined' && r.declinedOn) facts.appendChild(el('span', null, 'Declined ' + fmt(r.declinedOn)));
    if (r.status === 'progress' && r.printedOn) facts.appendChild(el('span', null, 'Printed ' + fmt(r.printedOn)));
    who.appendChild(facts);
    main.appendChild(who);

    var side = el('div', 'req-side');
    var pills = el('div', 'pills');
    if (r.crisis) pills.appendChild(el('span', 'pill crisis', 'Crisis'));
    pills.appendChild(el('span', 'pill ' + r.status, STATUS_LABEL[r.status]));
    side.appendChild(pills);

    var crisisLabel = el('label', 'crisis-check' + (r.crisis ? ' on' : ''));
    var cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = !!r.crisis;
    cb.id = 'crisis-' + r.id;
    cb.addEventListener('change', function () { setCrisis(r, cb.checked); });
    crisisLabel.appendChild(cb);
    crisisLabel.appendChild(document.createTextNode('Crisis'));
    side.appendChild(crisisLabel);

    var acts = el('div', 'acts');

    var toggle = el('button', 'btn quiet', state.open[r.id] ? 'Hide sizes' : 'View sizes');
    toggle.type = 'button';
    toggle.addEventListener('click', function () {
      state.open[r.id] = !state.open[r.id];
      render();
    });
    acts.appendChild(toggle);

    if (isOpen(r)) {
      // Once a sheet has been generated the action is a re-open, not a first print.
      var pr = el('button', 'btn ghost', r.status === 'progress' ? 'Open PDF again' : 'Print pick sheet');
      pr.type = 'button';
      pr.addEventListener('click', function () { doPrint(r); });
      acts.appendChild(pr);

      var fill = el('button', 'btn done', 'Mark filled');
      fill.type = 'button';
      fill.addEventListener('click', function () { markFilled(r); });
      acts.appendChild(fill);

      var dec = el('button', 'btn danger', 'Decline');
      dec.type = 'button';
      dec.addEventListener('click', function () {
        state.declining[r.id] = !state.declining[r.id];
        render();
      });
      acts.appendChild(dec);
    } else {
      var re = el('button', 'btn quiet', 'Reopen');
      re.type = 'button';
      re.addEventListener('click', function () { reopen(r); });
      acts.appendChild(re);
    }

    side.appendChild(acts);
    main.appendChild(side);
    box.appendChild(main);

    if (r.status === 'declined' && r.reason) {
      var rl = el('div', 'decline-panel');
      rl.appendChild(el('span', 'cap', 'Reason given'));
      rl.appendChild(el('div', 'reason-line', r.reason + (r.reasonNote ? ' — ' + r.reasonNote : '')));
      box.appendChild(rl);
    }

    if (state.declining[r.id]) box.appendChild(renderDeclinePanel(r));
    if (state.open[r.id]) box.appendChild(renderDetail(r));
    return box;
  }

  function renderDeclinePanel(r) {
    var p = el('div', 'decline-panel');
    p.appendChild(el('span', 'cap', 'Decline this request'));

    var fields = el('div', 'decline-fields');

    var sel = document.createElement('select');
    sel.id = 'reason-' + r.id;
    sel.setAttribute('aria-label', 'Reason for declining');
    sel.appendChild(new Option('Choose a reason…', ''));
    DECLINE_REASONS.forEach(function (x) { sel.appendChild(new Option(x, x)); });
    fields.appendChild(sel);

    var note = document.createElement('input');
    note.type = 'text';
    note.id = 'note-' + r.id;
    note.placeholder = 'Note for the record (optional)';
    note.setAttribute('aria-label', 'Note about the decline');
    fields.appendChild(note);

    p.appendChild(fields);

    var acts = el('div', 'decline-actions');
    var go = el('button', 'btn danger', 'Confirm decline');
    go.type = 'button';
    go.addEventListener('click', function () {
      if (!sel.value) { sel.focus(); return; }
      decline(r, sel.value, note.value.trim());
    });
    var cancel = el('button', 'btn quiet', 'Cancel');
    cancel.type = 'button';
    cancel.addEventListener('click', function () {
      state.declining[r.id] = false;
      render();
    });
    acts.appendChild(go);
    acts.appendChild(cancel);
    p.appendChild(acts);
    return p;
  }

  function render() {
    renderStats();
    renderFilters();

    var list = REQUESTS.filter(function (r) {
      return inFilter(r, state.filter) && matches(r, state.q);
    }).sort(function (a, b) {
      // Oldest waiting first -- the queue is worked front to back.
      if (isOpen(a) !== isOpen(b)) return isOpen(a) ? -1 : 1;
      // Crisis requests rise to the top of the open work, then oldest first.
      if (isOpen(a) && !!a.crisis !== !!b.crisis) return a.crisis ? -1 : 1;
      return parseDay(a.received) - parseDay(b.received);
    });

    queueEl.innerHTML = '';
    if (!list.length) {
      queueEl.appendChild(el('div', 'empty', 'No requests match. Try another filter or clear the search.'));
      return;
    }
    list.forEach(function (r) { queueEl.appendChild(renderRequest(r)); });
  }

  // ---------------------------------------------------------------------
  // Actions
  // ---------------------------------------------------------------------


  // -------------------------------------------------------------------------
  // Pick sheet PDF. Drawn at fixed coordinates rather than printed from CSS:
  // the browser's own pagination kept splitting slips across pages, and here
  // the page a slip lands on is arithmetic. Letter, 0.5in margins, 4 slips on
  // page one beneath the request header, 6 on every page after.
  // -------------------------------------------------------------------------

  var PT = { W: 612, H: 792, M: 36 };
  var COL_GAP = 12, ROW_GAP = 12;
  var CONTENT_W = PT.W - PT.M * 2;               // 540
  var SLIP_W = (CONTENT_W - COL_GAP) / 2;        // 264
  var SLIP_H = 230;
  var HEAD_H = PT.H - PT.M * 2 - (SLIP_H * 2) - (ROW_GAP * 2) - ROW_GAP; // room for 2 rows

  function logoData() {
    var img = document.querySelector('.masthead .logo');
    return img ? img.src : null;
  }

  function drawHeader(doc, r, y) {
    var x = PT.M, w = CONTENT_W, h = HEAD_H;
    doc.setLineWidth(1.5); doc.setDrawColor(0);
    doc.rect(x, y, w, h);

    var pad = 12, cy = y + pad;

    var logo = logoData();
    if (logo) { try { doc.addImage(logo, 'PNG', x + pad, cy, 40, 40); } catch (e) {} }

    doc.setFont('helvetica', 'bold'); doc.setFontSize(7.5);
    doc.text('CLOTHING REQUEST', x + pad + 50, cy + 14);
    doc.setFont('courier', 'bold'); doc.setFontSize(9);
    doc.text('REQUEST #' + r.id, x + w - pad, cy + 14, { align: 'right' });

    if (r.crisis) {
      var bw = 62, bh = 16, bx = x + w - pad - bw, by = cy + 22;
      doc.setFillColor(0); doc.rect(bx, by, bw, bh, 'F');
      doc.setTextColor(255); doc.setFont('helvetica', 'bold'); doc.setFontSize(9);
      doc.text('CRISIS', bx + bw / 2, by + 11.5, { align: 'center' });
      doc.setTextColor(0);
    }

    cy += 48;
    doc.setLineWidth(0.5); doc.line(x + pad, cy, x + w - pad, cy);

    cy += 16;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(7);
    doc.text('REQUESTED BY', x + pad, cy);
    cy += 20;
    doc.setFontSize(22);
    doc.text(r.name, x + pad, cy);
    cy += 16;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(12);
    doc.text(r.org || 'Requesting for their own household', x + pad, cy);

    // One strip: contact and counts together.
    cy += 12;
    var sh = 30, sx = x + pad, sw = w - pad * 2;
    doc.setLineWidth(0.5); doc.rect(sx, cy, sw, sh);
    var cells = [
      ['PHONE', r.phone], ['EMAIL', r.email],
      ['RECEIVED', fmt(r.received)], ['RECIPIENTS', String(r.people.length)]
    ];
    var cw = sw / cells.length;
    cells.forEach(function (c, i) {
      var cx = sx + cw * i;
      if (i) doc.line(cx, cy, cx, cy + sh);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(6);
      doc.text(c[0], cx + 6, cy + 11);
      doc.setFont('courier', 'bold'); doc.setFontSize(8.5);
      doc.text(doc.splitTextToSize(c[1], cw - 12)[0], cx + 6, cy + 23);
    });

    if (r.prayer) {
      cy += sh + 10;
      doc.setLineWidth(2); doc.line(x + pad, cy - 2, x + pad, cy + 12);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(6);
      doc.text('PRAYER REQUEST', x + pad + 6, cy + 3);
      doc.setFont('helvetica', 'italic'); doc.setFontSize(8.5);
      doc.text(doc.splitTextToSize('“' + r.prayer + '”', w - pad * 2 - 12)[0], x + pad + 6, cy + 13);
    }
  }

  function drawSlip(doc, r, person, index, total, x, y) {
    var w = SLIP_W, h = SLIP_H, pad = 9;
    doc.setLineWidth(0.8); doc.setDrawColor(0);
    doc.rect(x, y, w, h);

    // Traceability strip: who asked, and which slip of how many.
    var cy = y + 14;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(10);
    doc.text(doc.splitTextToSize(r.name, w - pad * 2 - 52)[0], x + pad, cy);
    doc.setFont('courier', 'normal'); doc.setFontSize(7.5);
    doc.text(index + ' of ' + total, x + w - pad, cy, { align: 'right' });
    cy += 11;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8);
    doc.text(doc.splitTextToSize(r.org || 'Own household', w - pad * 2 - 40)[0], x + pad, cy);
    doc.setFont('courier', 'normal'); doc.setFontSize(6.5);
    doc.text('#' + r.id, x + w - pad, cy, { align: 'right' });

    if (r.crisis) {
      cy += 12;
      var bw = 44, bh = 12;
      doc.setFillColor(0); doc.rect(x + pad, cy - 9, bw, bh, 'F');
      doc.setTextColor(255); doc.setFont('helvetica', 'bold'); doc.setFontSize(7);
      doc.text('CRISIS', x + pad + bw / 2, cy - 0.5, { align: 'center' });
      doc.setTextColor(0);
      cy -= 2;
    }

    cy += 8;
    doc.setLineWidth(1.2); doc.line(x, cy, x + w, cy);

    cy += 18;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(13);
    doc.text(doc.splitTextToSize(person.n, w - pad * 2)[0], x + pad, cy);
    cy += 12;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5);
    doc.text(person.a, x + pad, cy);

    // 2x2 size grid.
    cy += 8;
    var gx = x + pad, gw = w - pad * 2, cw = gw / 2, ch = 38;
    doc.setLineWidth(0.5);
    doc.rect(gx, cy, gw, ch * 2);
    doc.line(gx + cw, cy, gx + cw, cy + ch * 2);
    doc.line(gx, cy + ch, gx + gw, cy + ch);

    var vals = [
      ['SHIRT', person.shirt], ['PANTS', person.pant],
      ['SHOES', person.shoe], ['DIAPERS', person.dia]
    ];
    vals.forEach(function (v, i) {
      var cx = gx + (i % 2) * cw, cyy = cy + Math.floor(i / 2) * ch;
      doc.setFont('helvetica', 'bold'); doc.setFontSize(6);
      doc.text(v[0], cx + 5, cyy + 10);
      if (v[1]) {
        var parts = String(v[1]).split(' · ');
        var main = parts[0], sub = parts[1] || '';
        doc.setFont('courier', 'bold'); doc.setFontSize(12);
        doc.text(doc.splitTextToSize(main, cw - 10)[0], cx + 5, cyy + 24);
        if (sub) {
          doc.setFont('helvetica', 'normal'); doc.setFontSize(6);
          doc.text(doc.splitTextToSize(sub, cw - 10)[0], cx + 5, cyy + 33);
        }
      } else {
        doc.setFont('helvetica', 'italic'); doc.setFontSize(8);
        doc.text('Not needed', cx + 5, cyy + 24);
      }
    });

    cy += ch * 2 + 12;

    if (person.flag) {
      doc.setLineWidth(2); doc.line(x + pad, cy - 8, x + pad, cy + 4);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(7.5);
      var fl = doc.splitTextToSize(person.flag, w - pad * 2 - 8);
      doc.text(fl[0], x + pad + 6, cy);
      if (fl[1]) { doc.text(fl[1], x + pad + 6, cy + 9); cy += 9; }
      cy += 14;
    }

    doc.setFont('helvetica', 'bold'); doc.setFontSize(6);
    doc.text('ITEMS NEEDED MOST', x + pad, cy);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8);
    var notes = doc.splitTextToSize(person.notes || '—', w - pad * 2);
    var maxLines = Math.max(1, Math.floor((y + h - (cy + 10)) / 10));
    notes.slice(0, maxLines).forEach(function (ln, i) {
      doc.text(ln, x + pad, cy + 10 + i * 10);
    });
  }

  function buildPdf(r) {
    var doc = new window.jspdf.jsPDF({ unit: 'pt', format: 'letter' });
    var total = r.people.length;
    var i = 0, page = 0;

    while (i < total) {
      if (page > 0) doc.addPage();
      var top = PT.M;
      var rowsThisPage;
      if (page === 0) {
        drawHeader(doc, r, top);
        top += HEAD_H + ROW_GAP;
        rowsThisPage = 2;                 // 4 slips beside the header
      } else {
        rowsThisPage = 3;                 // 6 slips on a full page
      }
      for (var row = 0; row < rowsThisPage && i < total; row++) {
        for (var col = 0; col < 2 && i < total; col++) {
          drawSlip(doc, r, r.people[i], i + 1, total,
                   PT.M + col * (SLIP_W + COL_GAP),
                   top + row * (SLIP_H + ROW_GAP));
          i++;
        }
      }
      page++;
    }
    return doc;
  }

  window.__buildPdf = buildPdf;

  function todayStr() { return TODAY.toISOString().slice(0, 10); }

  // iPadOS reports itself as a Mac, so touch points are the reliable tell.
  function isIOS() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
           (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }

  function doPrint(r) {
    var wasPrinted = r.status === 'progress';
    var doc;
    try {
      doc = buildPdf(r);
    } catch (e) {
      toast('Could not build the pick sheet PDF: ' + e.message);
      return;
    }

    var name = 'pick-sheet-' + r.id + (r.crisis ? '-CRISIS' : '') + '.pdf';

    function markPrinted() {
      if (r.status === 'new') {
        r.status = 'progress';
        r.printedOn = todayStr();
      }
      render();
    }

    // On an iPad, hand the PDF to the share sheet: that is where AirPrint
    // lives, and Safari will not reliably open a blob: URL in a new tab.
    if (isIOS() && navigator.canShare) {
      try {
        var file = new File([doc.output('blob')], name, { type: 'application/pdf' });
        if (navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], title: 'Pick sheet — ' + r.name })
            .then(function () {
              markPrinted();
              toast('Pick sheet sent to the share sheet — choose Print.');
            })
            .catch(function () { /* the volunteer cancelled; nothing to report */ });
          return;
        }
      } catch (e) { /* fall through to the tab, then the file */ }
    }

    // Desktop: open it in a tab so it can be read and printed from there.
    // Not from file:// though -- a blob URL inherits that page's null origin
    // and Chrome refuses to navigate to it (ERR_BLOCKED_BY_CLIENT). Served
    // over http, which is how the real app will run, the tab opens fine.
    var opened = null;
    if (location.protocol !== 'file:') {
      try {
        opened = window.open(doc.output('bloburl'), '_blank');
      } catch (e) {
        opened = null;
      }
    }

    if (opened) {
      markPrinted();
      toast(wasPrinted
        ? 'Pick sheet for ' + r.name + ' reopened in a new tab.'
        : 'Pick sheet for ' + r.name + ' opened in a new tab — print it from there.');
      return;
    }

    // Blocked tab, a file:// page, or a sandbox that forbids one: save it
    // rather than lose it.
    try {
      doc.save(name);
      markPrinted();
      toast(location.protocol === 'file:'
        ? name + ' saved. Opening in a tab needs the page served over http, not opened from disk.'
        : 'New tab was blocked, so ' + name + ' was saved instead.');
    } catch (e2) {
      toast('This frame blocks new tabs and downloads — open the page directly to get the PDF.');
    }
  }

  function markFilled(r) {
    var prev = { status: r.status, filledOn: r.filledOn };
    r.status = 'filled';
    r.filledOn = todayStr();
    render();
    toast(r.name + '’s request marked filled.', 'Undo', function () {
      r.status = prev.status;
      r.filledOn = prev.filledOn;
      render();
    });
  }

  function setCrisis(r, on) {
    r.crisis = on;
    render();
    toast(on
      ? r.name + '’s request marked crisis — moved to the top of the queue.'
      : 'Crisis flag removed from ' + r.name + '’s request.');
  }

  function decline(r, reason, note) {
    var prev = { status: r.status, reason: r.reason, reasonNote: r.reasonNote, declinedOn: r.declinedOn };
    r.status = 'declined';
    r.reason = reason;
    r.reasonNote = note || '';
    r.declinedOn = todayStr();
    state.declining[r.id] = false;
    render();
    toast(r.name + '’s request declined — ' + reason.toLowerCase() + '.', 'Undo', function () {
      r.status = prev.status;
      r.reason = prev.reason;
      r.reasonNote = prev.reasonNote;
      r.declinedOn = prev.declinedOn;
      render();
    });
  }

  function reopen(r) {
    r.status = r.printedOn ? 'progress' : 'new';
    r.filledOn = null;
    r.declinedOn = null;
    r.reason = null;
    r.reasonNote = '';
    render();
    toast(r.name + '’s request reopened.');
  }

  // ---------------------------------------------------------------------
  // Toast
  // ---------------------------------------------------------------------

  var toastEl = null, toastTimer = null;

  function toast(msg, actionLabel, action) {
    if (toastEl) toastEl.remove();
    clearTimeout(toastTimer);
    toastEl = el('div', 'toast');
    toastEl.setAttribute('role', 'status');
    toastEl.appendChild(el('span', null, msg));
    if (actionLabel) {
      var b = el('button', null, actionLabel);
      b.type = 'button';
      b.addEventListener('click', function () {
        action();
        toastEl.remove();
        toastEl = null;
      });
      toastEl.appendChild(b);
    }
    document.body.appendChild(toastEl);
    toastTimer = setTimeout(function () {
      if (toastEl) { toastEl.remove(); toastEl = null; }
    }, 6000);
  }

  qEl.addEventListener('input', function () {
    state.q = qEl.value.trim();
    render();
  });

  // Open the oldest waiting request so the page shows what it does at rest.
  state.open['2026-0398'] = true;
  render();
})();
</script>
